name: Tarefa de agente
description: Unidade de trabalho executável sem contexto implícito.
title: '<verbo no imperativo> <objeto específico>'
labels: ['status:ready']
body:
  - type: markdown
    attributes:
      value: |
        **A issue é a fonte de verdade.** Decisões materiais de produto devem
        estar aprovadas antes da criação. Dependências ficam em Relationships,
        nunca apenas no corpo.

  - type: textarea
    id: problem
    attributes:
      label: Problema e motivo
      description: O que está errado e por que precisa ser resolvido agora.
    validations:
      required: true

  - type: textarea
    id: use_cases
    attributes:
      label: Casos de uso
      description: Momentos concretos em que este comportamento será usado.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: O que este PR entrega.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Fora do escopo
      description: O que explicitamente não entra neste PR.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Comportamento esperado
      description: Resultado observável depois do merge.
    validations:
      required: true

  - type: textarea
    id: technical_details
    attributes:
      label: Detalhes técnicos relevantes
      description: Contratos, módulos e decisões técnicas já aprovadas.

  - type: textarea
    id: expected_files
    attributes:
      label: Módulos, funções e arquivos previstos
      description: >
        Previsão não exaustiva. Inclua código e testes. Consequências diretas
        podem ser adicionadas com justificativa; contrato público, schema,
        dependência, autenticação ou permissão exigem decisão.
      placeholder: |
        - caminho/do/arquivo.ext
        - caminho/do/teste.ext
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Normalmente 6–10 resultados verificáveis.
      value: |
        - [ ]
        - [ ]
        - [ ] Precommit e testes afetados passam
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Cenários de teste
      description: Casos normais, limites, erros e regressões relevantes.
    validations:
      required: true

  - type: dropdown
    id: points
    attributes:
      label: Points
      description: Mede somente tamanho. Tickets acima de 5 devem ser quebrados.
      options: ['1', '2', '3', '5']
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Complexidade
      options: [Local, Entre módulos, Arquitetural]
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risco
      options: [Rotina, Elevado, Crítico]
    validations:
      required: true

  - type: dropdown
    id: uncertainty
    attributes:
      label: Incerteza
      options: [Baixa, Média, Alta]
    validations:
      required: true

  - type: dropdown
    id: specialty
    attributes:
      label: Especialidade
      options: [Geral, Elixir, Frontend, Dados, Infraestrutura, Segurança]
    validations:
      required: true

  - type: dropdown
    id: preview
    attributes:
      label: Preview
      options:
        - Não necessário
        - Servidor para QA
        - Revisão humana
    validations:
      required: true

  - type: dropdown
    id: merge_policy
    attributes:
      label: Política de merge
      options:
        - Humano obrigatório
        - Automático permitido
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: Rollout e kill switch
      description: Preencha quando houver risco. A flag nasce desligada.

  - type: checkboxes
    id: gate
    attributes:
      label: Antes de criar
      options:
        - label: >
            Decisões materiais foram aprovadas, testes pertencem a esta issue,
            dependências estão em Relationships e o PR será revisável. Se houver
            Revisão humana, apliquei preview:required. Se o merge automático for
            permitido, apliquei merge:auto e confirmei que o risco é Rotina.
          required: true
