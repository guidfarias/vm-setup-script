# .orchestrate.yml — contrato de execução do repositório

version: 3
language: pt-BR

repo:
  slug: guidfarias/vm-setup-script
  name: vm-setup-script
  default_branch: master
  branch_pattern: "{issue}-{slug}"

project:
  source: github
  default_scope: milestone
  dependency_source: blockedBy

orchestration:
  runner: orca
  worktree: new-top-level
  setup: run
  conduct: structured
  max_parallel_workers: 4
  max_dispatch_failures: 3
  detect_structural_conflicts: true
  high_contention_paths:
    - "**/migrations/**"
    - "**/schema.*"
    - "**/router.*"
    - "**/routes.*"

# Points mede somente tamanho. O modelo é escolhido pelas dimensões abaixo.
models:
  profiles:
    efficient:
      agent: codex
      family: openai
      model: gpt-5.6-luna
      effort: medium
    efficient_max:
      agent: codex
      family: openai
      model: gpt-5.6-luna
      effort: max
    balanced:
      agent: codex
      family: openai
      model: gpt-5.6-terra
      effort: high
    strongest:
      agent: codex
      family: openai
      model: gpt-5.6-sol
      effort: high
    adversarial:
      agent: claude
      family: anthropic
      model: sonnet
      effort: high

  routing:
    default: balanced
    rules:
      - when: { risk: Crítico }
        use: strongest
      - when: { complexity: Arquitetural }
        use: strongest
      - when: { uncertainty: Alta }
        use: strongest
      - when: { risk: Elevado }
        use: balanced
      - when: { complexity: "Entre módulos" }
        use: balanced
      - when: { uncertainty: Média }
        use: balanced
      - when: { complexity: Local, uncertainty: Baixa, risk: Rotina }
        use: efficient
    worker_overrides:
      "agent:strongest": strongest
      "agent:balanced": balanced
      "agent:efficient": efficient
      "agent:efficient-max": efficient_max

coordinator:
  normal: balanced
  critical: strongest

# Os arquivos são copiados pelo bootstrap para .claude/agents/. Workers Codex
# recebem o mesmo conteúdo no prompt da Task; não dependem de suporte nativo a
# subagentes do provider.
roles:
  product_manager:
    profile: product-manager
    phase: planning
  design_specialist:
    profile: design-specialist
    phase: planning
  implementer:
    profile: elixir-agent
    phase: implementation
    model_from_routing: true
    writes: true
  test_specialist:
    profile: test-specialist
    phase: testing
    model: balanced
    writes: sequential
  qa:
    profile: qa-agent
    phase: quality
    model: balanced
    writes: false
  adversarial_reviewer:
    profile: adversarial-reviewer
    phase: quality
    model: adversarial
    writes: false
    require_different_family_from_implementer: true

preview:
  enabled: false
  provider: portless
  app: vm-setup-script
  command: ""
  url_command: "portless get {app}"
  health_path: "/"
  startup_timeout_seconds: 90
  open_in_orca: false
  keep_alive_until_merge: false
  policies:
    none: "Não necessário"
    qa: "Servidor para QA"
    human: "Revisão humana"

commands:
  install: "true"
  precommit: "git diff --check && for file in ./*.sh; do bash -n \"$file\"; done"
  test: "for file in ./*.sh; do bash -n \"$file\"; done"
  test_file: "bash -n {file}"
  format: ""

github:
  pr:
    base: master
    draft: false
    body_requires:
      - "Closes #"
      - "## Resumo"
      - "## Plano de testes"
      - "## Verificação de escopo"
  monitor:
    event_driven: true
    distinguish_cancelled_by_push: true
    silent_stall_minutes: 20

quality:
  qa:
    enabled: true
    comment_on_pr: true
  adversarial_review:
    enabled: true
    comment_on_pr: true
    coordinator_confirms_findings: true
    max_fix_cycles: 3
  require_acceptance_evidence: true
  forbid_unrequested_removals: true

merge:
  auto:
    enabled: true
    issue_opt_in_label: "merge:auto"
    allowed_risks: [Rotina]
    forbid_human_preview: true
    require_up_to_date: true
    require_ci_green: true
    require_qa_verified: true
    require_adversarial_clear: true
    require_resolved_conversations: true
    forbidden_changes:
      - authentication
      - authorization
      - permission
      - public-contract
      - schema
      - migration
      - destructive-data
      - capability-removal
      - irreversible-rollout
  human_fallback: true

labels:
  ready: "status:ready"
  in_progress: "status:in-progress"
  in_review: "status:in-review"
  blocked: "status:blocked"
  needs_spec: "status:needs-spec"
  waiting_design: "status:waiting-design"
  waiting_decision: "status:waiting-decision"
  ready_to_merge: "status:ready-to-merge"
  preview_required: "preview:required"
  auto_merge: "merge:auto"

hooks:
  post_merge:
    - "Apresentar qualquer rollout em servidores para ação humana; nunca executar em produção."
    - "Quando a mudança tocar restauração, exigir teste supervisionado em homologação antes do rollout."

